<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fake News Detector AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="background"></div>

    <div class="container">
        
        <div class="logo">
            <!-- Espaço para adicionar uma imagem ou ícone de logo -->
        </div>

        <h1>Fake News Detector AI</h1>

        <p class="subtitle">
            Analise notícias utilizando Inteligência Artificial Generativa.
        </p>

        <textarea 
            id="news" 
            placeholder="Cole aqui a notícia para análise..."
        ></textarea>

        <button onclick="analyzeNews()">
            Analisar Notícia
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
